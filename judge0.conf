# Judge0 CE Configuration

# Database Configuration
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=YourSecurePassword123

# Redis Configuration
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=

# Resource Limits (안전한 샌드박스 정책)
# CPU 타임아웃: 기본 5.0초, 최대 10.0초 제한
CPU_TIME_LIMIT=5.0
CPU_EXTRA_TIME=1.0
MAX_CPU_TIME_LIMIT=10.0
MAX_CPU_EXTRA_TIME=2.0

# 메모리 한도: 512MB (512 * 1024 KB = 524288 KB)
MEMORY_LIMIT=524288
MAX_MEMORY_LIMIT=524288

# 스택 및 파일 크기 제한
ENABLE_STACK_LIMIT=true
STACK_LIMIT=128000
MAX_STACK_LIMIT=128000
ENABLE_MAX_FILE_SIZE=true
MAX_FILE_SIZE=4096
MAX_MAX_FILE_SIZE=8192

# 프로세스 및 스레드 제한 (포크 폭탄 방지)
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_PROCESSES_AND_OR_THREADS=120

# 컴파일러 활성화
ENABLE_COMPILERS=true

# 세부 프로세스 격리 설정
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
